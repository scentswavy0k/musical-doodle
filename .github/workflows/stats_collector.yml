name: Stats Collector

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run parsing script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python parser.py

      - name: Deploy litres.csv to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: litres.csv
          gist_file_name: litres.csv

      - name: Deploy livelib.csv to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: livelib.csv
          gist_file_name: livelib.csv

      - name: Deploy mybook.csv to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: mybook.csv
          gist_file_name: mybook.csv

      - name: Deploy bookmix.csv to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: bookmix.csv
          gist_file_name: bookmix.csv

      - name: Send CSV files to Telegram
        env:
          TGBOT_TOKEN: ${{ secrets.TGBOT_TOKEN }}
          TGBOT_CHATID: ${{ secrets.TGBOT_CHATID }}
          TGBOT_THREAD: ${{ secrets.TGBOT_THREAD }}
        run: |
          DATE_UTC=$(date -u '+%Y_%m_%d')
          LITRES_NAME="${DATE_UTC}_litres.csv"
          LIVELIB_NAME="${DATE_UTC}_livelib.csv"
          MYBOOK_NAME="${DATE_UTC}_mybook.csv"
          BOOKMIX_NAME="${DATE_UTC}_bookmix.csv"

          cp litres.csv  "${LITRES_NAME}"
          cp livelib.csv "${LIVELIB_NAME}"
          cp mybook.csv  "${MYBOOK_NAME}"
          cp bookmix.csv "${BOOKMIX_NAME}"

          THREAD_OPT=()
          if [ -n "${TGBOT_THREAD}" ]; then
            THREAD_OPT=(-F "message_thread_id=${TGBOT_THREAD}")
          fi

          curl --fail-with-body -sS \
            -F "chat_id=${TGBOT_CHATID}" \
            "${THREAD_OPT[@]}" \
            -F 'media=[{"type": "document", "media": "attach://file1", "caption": "'"${LITRES_NAME}"'"}, {"type": "document", "media": "attach://file2", "caption": "'"${LIVELIB_NAME}"'"}, {"type": "document", "media": "attach://file3", "caption": "'"${MYBOOK_NAME}"'"}, {"type": "document", "media": "attach://file4", "caption": "'"${BOOKMIX_NAME}"'"}]' \
            -F "file1=@${LITRES_NAME}" \
            -F "file2=@${LIVELIB_NAME}" \
            -F "file3=@${MYBOOK_NAME}" \
            -F "file4=@${BOOKMIX_NAME}" \
            "https://api.telegram.org/bot${TGBOT_TOKEN}/sendMediaGroup" \
            || echo "::warning::Не удалось отправить файлы в Telegram — данные уже в Gist, некритично"
