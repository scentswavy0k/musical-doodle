name: Update Daily Gist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-24.04 # Явно закрепляем стабильную версию ОС
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # Обновлено для Node.js 24

      - name: Set up Python
        uses: actions/setup-python@v6 # Обновлено для Node.js 24
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run parsing script
        run: python parser.py

      - name: Deploy to Gist
        uses: exuanbo/actions-deploy-gist@v1 # Пока оставляем, но помним о риске
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: data.csv
          gist_file_name: data.csv
